<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDBS Speaker Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #2C96D5; --brand-dark: #1a78b0; --brand-light: #e8f5fc; --brand-mid: #5aaedd;
    --bg: #f5f8fb; --surface: #ffffff; --surface-alt: #f0f6fa;
    --border: #d8eaf5; --border-strong: #b8d4ea;
    --text: #0d1f2d; --text-mid: #2a4a5e; --text-muted: #6a8fa8; --text-faint: #a8c4d8;
    --green: #1a8a5a; --amber: #8a5a00;
    --team: #1a5a3a; --team-bg: #f0f9f4; --team-border: #b8dfc8;
    --sponsor: #7a5a00; --sponsor-bg: #fffbec; --sponsor-border: #e8d080;
    --shadow: 0 2px 8px rgba(13,31,45,0.07); --shadow-md: 0 10px 30px rgba(13,31,45,0.13);
  }
  body { font-family: 'Lexend', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Team cards (inside content area) ── */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .team-card { background: var(--surface); border: 1px solid var(--team-border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
  .team-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--team); }
  .team-card-img { width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--team-bg); }
  .team-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .team-card:hover .team-card-img img { transform: scale(1.04); }
  .team-card-initials { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, var(--team-bg), #c8e8d8); }
  .team-card-info { padding: 14px 16px 16px; }
  .team-card-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; line-height: 1.2; }
  .team-card-title { font-size: 12px; color: var(--team); font-weight: 600; margin-bottom: 2px; }
  .team-card-company { font-size: 12px; color: var(--text-muted); }
  .team-card-footer { margin-top: 10px; }
  .team-cta { font-size: 11px; color: var(--team); font-weight: 600; }
  .team-tab-header { margin-bottom: 32px; }
  .team-tab-title { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 20px; font-weight: 300; }

  /* ── Hero ── */
  .hero { background: linear-gradient(160deg, #0d2a42 0%, #0f3558 40%, #1a5a80 100%); padding: 52px 28px 0; position: relative; overflow: hidden; }
  .hero-circle-1 { position: absolute; top: -60px; right: -60px; width: 280px; height: 280px; border-radius: 50%; border: 1px solid rgba(44,150,213,0.2); pointer-events: none; }
  .hero-circle-2 { position: absolute; top: -20px; right: 40px; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(44,150,213,0.12); pointer-events: none; }
  .hero-blob { position: absolute; bottom: 0; left: -40px; width: 200px; height: 200px; border-radius: 50%; background: rgba(44,150,213,0.07); pointer-events: none; }
  .hero-inner { max-width: 1140px; margin: 0 auto; position: relative; }
  .hero-eyebrow { font-size: 10px; color: var(--brand-mid); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
  .hero-title { font-size: clamp(28px, 5vw, 46px); font-weight: 700; color: #fff; line-height: 1.1; margin-bottom: 10px; }
  .hero-sub { font-size: 15px; color: rgba(255,255,255,0.62); max-width: 520px; line-height: 1.6; font-weight: 300; margin-bottom: 36px; }
  .hero-stats { display: flex; gap: 28px; margin-bottom: 36px; flex-wrap: wrap; }
  .hero-stat-val { font-size: 28px; font-weight: 700; color: #fff; line-height: 1; }
  .hero-stat-lbl { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; letter-spacing: 0.5px; }
  .hero-tabs { display: flex; }
  .hero-tab { background: transparent; border: none; border-bottom: 3px solid transparent; color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 400; padding: 10px 20px 14px; cursor: pointer; font-family: 'Lexend', sans-serif; transition: all 0.15s; }
  .hero-tab.active { color: #fff; font-weight: 700; border-bottom-color: #fff; }

  /* ── Content ── */
  .content { max-width: 1140px; margin: 0 auto; padding: 40px 28px 80px; }

  /* ── Filter bar ── */
  .filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 36px; }
  .filter-btn { background: var(--surface); color: var(--text-mid); border: 1.5px solid var(--border); border-radius: 20px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Lexend', sans-serif; transition: all 0.15s; }
  .filter-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .filter-search { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 8px 16px; color: var(--text); font-size: 13px; font-family: 'Lexend', sans-serif; outline: none; width: 200px; transition: border-color 0.15s; margin-left: auto; }
  .filter-search:focus { border-color: var(--brand); }

  /* ── Session block ── */
  .session-block { margin-bottom: 52px; }
  .session-header-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .session-bar { width: 3px; height: 36px; border-radius: 2px; background: var(--brand); flex-shrink: 0; }
  .session-time-lbl { font-size: 10px; color: var(--brand); font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 2px; }
  .session-name { font-size: 20px; font-weight: 700; color: var(--text); }
  .room-section { margin-bottom: 28px; }
  .room-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .room-pill { font-size: 10px; background: var(--brand-light); color: var(--brand); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .room-topic { font-size: 14px; color: var(--text-mid); font-weight: 600; }
  .room-topic.tbd { color: var(--text-faint); font-style: italic; font-weight: 400; }
  .panelist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }

  /* ── Panelist card ── */
  .p-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; overflow: hidden; cursor: pointer; transition: all 0.22s ease; }
  .p-card:hover { border-color: var(--brand); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(44,150,213,0.18); }
  .p-card-img { width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--surface-alt); position: relative; }
  .p-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .p-card:hover .p-card-img img { transform: scale(1.04); }
  .p-card-initials { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, var(--brand-light), var(--border)); }
  .p-card-badge-wrap { position: absolute; top: 10px; left: 10px; }
  .p-card-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 50px; background: linear-gradient(to top, rgba(255,255,255,0.9), transparent); }
  .p-card-info { padding: 14px 16px 16px; }
  .p-card-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; margin-bottom: 4px; }
  .p-card-title { font-size: 12px; color: var(--brand); font-weight: 600; margin-bottom: 2px; }
  .p-card-company { font-size: 12px; color: var(--text-muted); }
  .p-card-footer { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
  .p-card-cta { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
  .li-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: var(--surface-alt); text-decoration: none; }
  .li-btn:hover, .p-card:hover .li-btn { background: var(--brand); border-color: var(--brand); }
  .li-btn:hover svg, .p-card:hover .li-btn svg { fill: #ffffff !important; }

  /* ── Sponsor card (gold accent) ── */
  .p-card.sponsor-card { border-color: var(--sponsor-border); }
  .p-card.sponsor-card:hover { border-color: var(--sponsor); box-shadow: 0 12px 32px rgba(200,160,0,0.18); }

  /* ── Role badge ── */
  .sdbs-badge { display: inline-block; border-radius: 20px !important; padding: 3px 10px !important; font-size: 10px !important; font-weight: 700 !important; letter-spacing: 0.8px !important; text-transform: uppercase !important; border: 1px solid !important; line-height: 1.4 !important; }
  .sdbs-badge-Moderator { background: rgba(44,150,213,0.15) !important; color: #1a4a9a !important; border-color: rgba(44,150,213,0.4) !important; }
  .sdbs-badge-Panelist { background: #e8f5fc !important; color: #2C96D5 !important; border-color: #d8eaf5 !important; }
  .sdbs-badge-Keynote { background: #fff5e0 !important; color: #8a5a00 !important; border-color: #f0d090 !important; }
  .sdbs-badge-Sponsor { background: #fffbec !important; color: #7a5a00 !important; border-color: #e8d080 !important; }
  .sdbs-badge-Team { background: #f0f9f4 !important; color: #1a5a3a !important; border-color: #b8dfc8 !important; }

  /* ── Keynote block ── */
  .keynote-hero { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); border-radius: 20px; padding: 24px 28px; margin-bottom: 24px; position: relative; overflow: hidden; }
  .keynote-hero::before { content:''; position:absolute; top:-30px; right:-30px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,0.06); }
  .keynote-hero::after  { content:''; position:absolute; bottom:-20px; right:60px; width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.04); }
  .keynote-eyebrow { font-size: 10px; color: rgba(255,255,255,0.65); font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 8px; }
  .keynote-title { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.25; margin-bottom: 4px; }
  .keynote-topic { font-size: 13px; color: rgba(255,255,255,0.75); font-style: italic; }

  /* ── Break divider ── */
  .break-divider { display: flex; align-items: center; gap: 16px; padding: 14px 0; margin-bottom: 10px; }
  .break-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .break-text { font-size: 12px; color: var(--text-faint); font-style: italic; }

  /* ── Bio modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(13,31,45,0.5); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; backdrop-filter: blur(8px); }
  .modal-overlay.visible { display: flex; }
  .modal-box { background: var(--surface); border-radius: 24px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(13,31,45,0.22); overflow: hidden; animation: fadeUp 0.22s ease; }
  .modal-accent { height: 5px; background: linear-gradient(90deg, var(--brand), var(--brand-mid)); }
  .modal-accent.team-accent { background: linear-gradient(90deg, var(--team), #2a8a5a); }
  .modal-body { padding: 32px; }
  .modal-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
  .modal-avatar { flex-shrink: 0; }
  .modal-avatar img { width: 80px; height: 80px; border-radius: 16px; object-fit: cover; border: 3px solid var(--border); }
  .modal-avatar-initials { width: 80px; height: 80px; border-radius: 16px; background: linear-gradient(135deg, var(--brand), var(--brand-mid)); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #fff; }
  .modal-avatar-initials.team { background: linear-gradient(135deg, var(--team), #2a8a5a); }
  .modal-info { flex: 1; min-width: 0; }
  .modal-name { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.15; margin-bottom: 4px; }
  .modal-title-line { font-size: 13px; color: var(--brand); font-weight: 600; }
  .modal-title-line.team { color: var(--team); }
  .modal-company { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .modal-close { background: transparent; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .modal-bio { font-size: 14px; color: var(--text-mid); line-height: 1.7; margin-bottom: 22px; }
  .modal-bio-empty { font-size: 14px; color: var(--text-faint); font-style: italic; margin-bottom: 22px; }
  .modal-li-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand); color: #fff; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600; text-decoration: none; }
  .modal-email-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--team-bg); color: var(--team); border: 1px solid var(--team-border); border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600; text-decoration: none; margin-left: 10px; }

  /* ── Footer ── */
  .footer { border-top: 1px solid var(--border); padding: 24px 28px; background: var(--surface); }
  .footer-inner { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .footer-text { font-size: 13px; color: var(--text-muted); }
  .footer-note { font-size: 12px; color: var(--text-faint); }

  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @media (max-width:600px) { .hero { padding: 36px 16px 0; } .content { padding: 24px 16px 60px; } .team-section { padding: 28px 16px; } }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-circle-1"></div>
  <div class="hero-circle-2"></div>
  <div class="hero-blob"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">San Diego Business Symposium · May 18, 2026</div>
    <h1 class="hero-title">Meet Our Speakers</h1>
    <p class="hero-sub">Industry leaders across cybersecurity, business, law, and technology — gathered for one day of insight and connection.</p>
    <div class="hero-stats" id="heroStats"></div>
    <div class="hero-tabs">
      <button class="hero-tab active" onclick="switchTab('sessions',this)">By Session</button>
      <button class="hero-tab" onclick="switchTab('all',this)">All Speakers</button>
      <button class="hero-tab" id="teamTab" onclick="switchTab('team',this)" style="display:none;">Meet the Team</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content" id="content"></div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-inner">
    <div class="footer-text">San Diego Business Symposium · May 18, 2026 · San Diego</div>
    <div class="footer-note">Speaker lineup subject to change</div>
  </div>
</div>

<!-- BIO MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-accent" id="modalAccent"></div>
    <div class="modal-body">
      <div class="modal-header">
        <div class="modal-avatar" id="modalAvatar"></div>
        <div class="modal-info">
          <div id="modalBadge" style="margin-bottom:6px;"></div>
          <div class="modal-name" id="modalName"></div>
          <div id="modalTitleLine"></div>
          <div class="modal-company" id="modalCompany"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBio"></div>
      <div id="modalLinks"></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js'

const supabase = createClient('https://gvkjvbpaavaofdelvnlz.supabase.co', 'sb_publishable_kEz5hrc6H4B1QsK5M7Zarg_t6FL-oAV')

const DEFAULT_SESSION_ROWS = [
  { id:'s1a', group_key:'s1', time:'8:55 – 9:30 AM', label:'Breakout Session 1', room:'Room A', topic:'Fractional Resources To Grow and Protect Your Small Business', sort_order:1, is_break:false, is_keynote:false, is_active:true },
  { id:'s1b', group_key:'s1', time:'8:55 – 9:30 AM', label:'Breakout Session 1', room:'Room B', topic:'Who Owns Risk? Insurance, Cyber, and the Next 10 Years', sort_order:2, is_break:false, is_keynote:false, is_active:true },
  { id:'s2a', group_key:'s2', time:'9:40 – 10:15 AM', label:'Breakout Session 2', room:'Room A', topic:'Cyber Threats, Protection Strategies, and Risk Perspective', sort_order:3, is_break:false, is_keynote:false, is_active:true },
  { id:'s2b', group_key:'s2', time:'9:40 – 10:15 AM', label:'Breakout Session 2', room:'Room B', topic:'Topic TBD', sort_order:4, is_break:false, is_keynote:false, is_active:true },
  { id:'net', group_key:'net', time:'10:15 – 11:15 AM', label:'Networking Session', room:'', topic:'', sort_order:5, is_break:true, is_keynote:false, is_active:true },
  { id:'s3a', group_key:'s3', time:'11:15 – 11:50 AM', label:'Breakout Session 3', room:'Room A', topic:'Keeping the Humans in Human Capital', sort_order:6, is_break:false, is_keynote:false, is_active:true },
  { id:'s3b', group_key:'s3', time:'11:15 – 11:50 AM', label:'Breakout Session 3', room:'Room B', topic:'Cyber Resilience in Action — A Tabletop Exercise', sort_order:7, is_break:false, is_keynote:false, is_active:true },
  { id:'s4a', group_key:'s4', time:'12:00 – 12:35 PM', label:'Breakout Session 4', room:'Room A', topic:'You Have AI Questions, We Have Answers', sort_order:8, is_break:false, is_keynote:false, is_active:true },
  { id:'s4b', group_key:'s4', time:'12:00 – 12:35 PM', label:'Breakout Session 4', room:'Room B', topic:'Topic TBD', sort_order:9, is_break:false, is_keynote:false, is_active:true },
  { id:'keynote', group_key:'keynote', time:'12:35 – 2:00 PM', label:'Networking Lunch & Keynote', room:'', topic:"Engineering, Identification and Prevention for All. Don't be the Next Victim", sort_order:10, is_break:false, is_keynote:true, is_active:true },
]

let panelists = []
let scheduleRows = []
let currentTab = 'sessions'
let activeFilter = 'All'
let searchVal = ''

function speakers() { return panelists.filter(p => p.type !== 'organizer') }
function organizers() { return panelists.filter(p => p.type === 'organizer') }

function normalizeSessionId(value) {
  if (!value) return ''
  const v = String(value).trim()
  if (scheduleRows.map(r=>r.id).includes(v)) return v
  const map = { 'Keynote':'keynote','Networking Lunch & Keynote':'keynote' }
  return map[v] || v
}

function normalizeRow(row) {
  const sessionId = normalizeSessionId(row.session_id ?? row.sessionId ?? row.panel_name ?? row.Panel_Name)
  const role = row.role ?? row.Role ?? (sessionId === 'keynote' ? 'Keynote Speaker' : 'Panelist')
  return {
    id: String(row.id),
    name: row.name ?? '',
    title: row.title ?? '',
    company: row.company ?? '',
    email: row.email ?? '',
    role,
    sessionId,
    type: row.type ?? 'speaker',
    linkedin: row.linkedin ?? '',
    bio: row.bio ?? '',
    headshot: row.headshot_url ?? row.headshot ?? null,
  }
}

function normalizeSessionRow(row) {
  return {
    id: String(row.id),
    group_key: row.group_key ?? String(row.id),
    time: row.time ?? '',
    label: row.label ?? '',
    room: row.room ?? '',
    topic: row.topic ?? '',
    sort_order: Number(row.sort_order ?? 0),
    is_break: Boolean(row.is_break ?? false),
    is_keynote: Boolean(row.is_keynote ?? false),
    is_active: row.is_active ?? true,
  }
}

async function loadSchedule() {
  const { data, error } = await supabase.from('sessions').select('*').order('sort_order', { ascending: true })
  scheduleRows = (error || !data || data.length===0)
    ? DEFAULT_SESSION_ROWS.map(normalizeSessionRow)
    : data.filter(r=>r.is_active!==false).map(normalizeSessionRow).sort((a,b)=>a.sort_order-b.sort_order)
}

async function loadPanelists() {
  const { data, error } = await supabase.from('panelists').select('*').order('display_order', { ascending: true })
  panelists = (error || !data) ? [] : data.map(normalizeRow)
}

function groupedSchedule() {
  const rows = scheduleRows.filter(r=>r.is_active!==false).sort((a,b)=>a.sort_order-b.sort_order)
  const groups = []; const seen = new Set()
  for (const row of rows) {
    const key = row.group_key || row.id
    if (seen.has(key)) continue; seen.add(key)
    const members = rows.filter(r=>(r.group_key||r.id)===key)
    const first = members[0]
    if (first.is_break) groups.push({ type:'break', id:key, time:first.time, label:first.label, sort_order:first.sort_order })
    else if (first.is_keynote) groups.push({ type:'keynote', id:key, time:first.time, label:first.label, topic:first.topic, sessionId:first.id, sort_order:first.sort_order })
    else groups.push({ type:'session', id:key, time:first.time, label:first.label, rooms:members, sort_order:first.sort_order })
  }
  return groups.sort((a,b)=>a.sort_order-b.sort_order)
}

function initials(name) { return (name||'?').split(' ').filter(Boolean).map(n=>n[0]).join('').slice(0,2).toUpperCase() }

function badgeHTML(role) {
  if (role==='Keynote Speaker') return `<span class="sdbs-badge sdbs-badge-Keynote">${role}</span>`
  if (role==='Featured Sponsor') return `<span class="sdbs-badge sdbs-badge-Sponsor">Diamond Sponsor</span>`
  return `<span class="sdbs-badge sdbs-badge-${role}">${role}</span>`
}

function cardHTML(p) {
  const src = p.headshot
  const inits = initials(p.name)
  const isSponsor = p.role === 'Featured Sponsor'
  const hasMeta = p.bio || p.linkedin
  return `
    <div class="p-card${isSponsor?' sponsor-card':''}" onclick="openModal('${p.id}')">
      <div class="p-card-img">
        ${src
          ? `<img src="${src}" alt="${p.name}">`
          : `<div class="p-card-initials"><span style="font-size:42px;font-weight:700;color:var(--brand);opacity:0.7;">${inits}</span></div>`
        }
        <div class="p-card-badge-wrap">${badgeHTML(p.role)}</div>
        <div class="p-card-fade"></div>
      </div>
      <div class="p-card-info">
        <div class="p-card-name">${p.name}</div>
        <div class="p-card-title">${p.title||''}</div>
        ${p.company?`<div class="p-card-company">${p.company}</div>`:''}
        <div class="p-card-footer">
          <span class="p-card-cta" style="color:${hasMeta?(isSponsor?'var(--sponsor)':'var(--brand)'):'transparent'}">${hasMeta?'View profile →':''}</span>
          ${p.linkedin?`<a href="${p.linkedin}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="li-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--brand)"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>`:''}
        </div>
      </div>
    </div>`
}

function teamCardHTML(p) {
  const src = p.headshot
  const inits = initials(p.name)
  const hasMeta = p.bio || p.linkedin || p.email
  return `
    <div class="team-card" onclick="openModal('${p.id}')">
      <div class="team-card-img">
        ${src
          ? `<img src="${src}" alt="${p.name}">`
          : `<div class="team-card-initials"><span style="font-size:40px;font-weight:700;color:var(--team);opacity:0.6;">${inits}</span></div>`
        }
      </div>
      <div class="team-card-info">
        <div class="team-card-name">${p.name}</div>
        <div class="team-card-title">${p.title||''}</div>
        <div class="team-card-company">${p.company||''}</div>
        ${hasMeta?`<div class="team-card-footer"><span class="team-cta">View profile →</span></div>`:''}
      </div>
    </div>`
}

function renderTeam() {
  const team = organizers()
  // Show/hide the tab based on whether team members exist
  const tab = document.getElementById('teamTab')
  if (tab) tab.style.display = team.length > 0 ? 'inline-block' : 'none'
}

function renderTeamContent() {
  const team = organizers()
  document.getElementById('content').innerHTML = `
    <div class="team-tab-header">
      <p class="team-tab-title" style="color:var(--text-muted);font-size:14px;">The people behind the San Diego Business Symposium</p>
    </div>
    ${team.length > 0
      ? `<div class="team-grid">${team.map(teamCardHTML).join('')}</div>`
      : `<div style="text-align:center;padding:60px 0;color:var(--text-faint);font-size:14px;">No team members found.</div>`
    }`
}

function updateHeroStats() {
  const spkrs = speakers()
  const sessions = scheduleRows.filter(r=>!r.is_break&&!r.is_keynote).length
  document.getElementById('heroStats').innerHTML = [
    { val: spkrs.length, lbl:'Speakers' },
    { val: Math.ceil(sessions/2), lbl:'Sessions' },
    { val: sessions, lbl:'Breakout Rooms' },
  ].map(s=>`<div><div class="hero-stat-val">${s.val}</div><div class="hero-stat-lbl">${s.lbl}</div></div>`).join('')
}

function renderCurrent() {
  if (currentTab==='sessions') renderSessions()
  else if (currentTab==='team') renderTeamContent()
  else renderAll()
}

function renderSessions() {
  const spkrs = speakers()
  let html = ''
  for (const s of groupedSchedule()) {
    if (s.type==='break') {
      html += `<div class="break-divider"><div class="break-dot"></div><span class="break-text">${s.time} · ${s.label}</span></div>`
      continue
    }
    if (s.type==='keynote') {
      const kp = spkrs.filter(p=>p.sessionId===s.sessionId)
      html += `
        <div class="session-block">
          <div class="keynote-hero">
            <div class="keynote-eyebrow">${s.time} · Keynote</div>
            <div class="keynote-title">${s.label}</div>
            <div class="keynote-topic">${s.topic||''}</div>
          </div>
          ${kp.length>0?`<div class="panelist-grid">${kp.map(cardHTML).join('')}</div>`:''}
        </div>`
      continue
    }
    html += `<div class="session-block">
      <div class="session-header-row">
        <div class="session-bar"></div>
        <div><div class="session-time-lbl">${s.time}</div><div class="session-name">${s.label}</div></div>
      </div>`
    for (const r of s.rooms) {
      const rp = spkrs.filter(p=>p.sessionId===r.id)
      const isTBD = (r.topic||'').includes('TBD')
      if (rp.length===0 && isTBD) continue
      html += `
        <div class="room-section">
          <div class="room-row">
            <span class="room-pill">${r.room||'Panel'}</span>
            <span class="room-topic${isTBD?' tbd':''}">${r.topic||'Untitled panel'}</span>
          </div>
          ${rp.length>0?`<div class="panelist-grid">${rp.map(cardHTML).join('')}</div>`:''}
        </div>`
    }
    html += '</div>'
  }
  document.getElementById('content').innerHTML = html
}

function renderAll() {
  const q = searchVal.toLowerCase()
  const spkrs = speakers()
  // Deduplicate by name
  const seen = new Map()
  for (const p of spkrs) {
    const key = p.name.trim().toLowerCase()
    if (!seen.has(key)) seen.set(key, p)
  }
  const deduped = [...seen.values()].filter(p => {
    const matchRole = activeFilter==='All' || p.role===activeFilter
    const matchSearch = !q || [p.name,p.company,p.title].join(' ').toLowerCase().includes(q)
    return matchRole && matchSearch
  })

  const filters = ['All','Moderator','Panelist','Keynote Speaker','Featured Sponsor']
  const filterBar = `
    <div class="filter-bar">
      <div style="display:flex;gap:6px;flex:1;flex-wrap:wrap;">
        ${filters.map(f=>`<button class="filter-btn${activeFilter===f?' active':''}" onclick="setFilter('${f}')">${f==='Featured Sponsor'?'Diamond Sponsor':f}</button>`).join('')}
      </div>
      <input class="filter-search" placeholder="Search speakers…" value="${searchVal}" oninput="setSearch(this.value)">
    </div>`

  const grid = deduped.length>0
    ? `<div class="panelist-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));">${deduped.map(cardHTML).join('')}</div>`
    : `<div style="text-align:center;padding:60px 0;color:var(--text-faint);font-size:14px;">No speakers match your search.</div>`

  document.getElementById('content').innerHTML = filterBar + grid
}

function setFilter(f) { activeFilter = f; renderAll() }
function setSearch(v) { searchVal = v; renderAll() }

window.switchTab = function(tab, btn) {
  currentTab = tab
  document.querySelectorAll('.hero-tab').forEach(t=>t.classList.remove('active'))
  btn.classList.add('active')
  activeFilter = 'All'; searchVal = ''
  renderCurrent()
}

window.openModal = function(id) {
  const p = panelists.find(x=>String(x.id)===String(id))
  if (!p) return
  const src = p.headshot
  const inits = initials(p.name)
  const isTeam = p.type === 'organizer'

  document.getElementById('modalAccent').className = 'modal-accent' + (isTeam ? ' team-accent' : '')
  document.getElementById('modalAvatar').innerHTML = src
    ? `<img src="${src}" alt="${p.name}">`
    : `<div class="modal-avatar-initials${isTeam?' team':''}">${inits}</div>`
  document.getElementById('modalBadge').innerHTML = isTeam
    ? '<span class="sdbs-badge sdbs-badge-Team">Event Team</span>'
    : badgeHTML(p.role)
  document.getElementById('modalName').textContent = p.name
  document.getElementById('modalTitleLine').innerHTML = `<div class="modal-title-line${isTeam?' team':''}">${p.title||''}</div>`
  document.getElementById('modalCompany').textContent = p.company||''
  document.getElementById('modalBio').innerHTML = p.bio
    ? `<p class="modal-bio">${p.bio}</p>`
    : `<p class="modal-bio-empty">Bio coming soon.</p>`

  let links = ''
  if (p.linkedin) links += `<a href="${p.linkedin}" target="_blank" rel="noopener" class="modal-li-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
    View LinkedIn
  </a>`
  if (p.email && isTeam) links += `<a href="mailto:${p.email}" class="modal-email-btn">✉ ${p.email}</a>`
  document.getElementById('modalLinks').innerHTML = links

  document.getElementById('modalOverlay').classList.add('visible')
}

window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('visible')
}

await loadSchedule()
await loadPanelists()
renderTeam()
updateHeroStats()
renderCurrent()

// ── iframe resize reporting ───────────────────────────────────────────────────
function sendHeight() {
  window.parent.postMessage({ type: 'resize', height: document.documentElement.scrollHeight }, '*')
}
window.addEventListener('load', sendHeight)
window.addEventListener('resize', sendHeight)
const contentEl = document.getElementById('content')
if (contentEl) {
  new MutationObserver(() => setTimeout(sendHeight, 120)).observe(contentEl, { childList: true, subtree: true })
}

// ── Modal open/close notify parent overlay ───────────────────────────────────
const _origOpen = window.openModal
window.openModal = function(id) {
  _origOpen(id)
  window.parent.postMessage({ type: 'modalOpen' }, '*')
}
const _origClose = window.closeModal
window.closeModal = function() {
  _origClose()
  window.parent.postMessage({ type: 'modalClose' }, '*')
}

// ── Listen for parent telling us to close modal ──────────────────────────────
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'closeModal') {
    document.getElementById('modalOverlay').classList.remove('visible')
  }
})
</script>
</body>
</html>
